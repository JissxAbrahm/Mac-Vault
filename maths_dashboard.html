<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📘 MATHS Dashboard - Teacher A</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .dashboard-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #76ffcb;
    }

    h3 {
      font-weight: 400;
      margin-bottom: 25px;
      color: #fceabb;
    }

    label {
      font-size: 1rem;
      display: block;
      margin-bottom: 8px;
      text-align: left;
      color: #f9f9f9;
    }

    input[type="file"] {
      margin-bottom: 20px;
      padding: 8px;
      width: 100%;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
    }

    input[type="submit"] {
      background: #00ffd0;
      color: #1a1a1a;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }

    input[type="submit"]:hover {
      background: #4cffc3;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
      color: #a2ffea;
    }

    .upload-block {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="icon">📘</div>
    <h1>Welcome Teacher A</h1>
    <h3>MATHS Dashboard - Upload or Edit Files</h3>

    <form action="upload.php" method="post" enctype="multipart/form-data">
      <div class="upload-block">
        <label for="notesFile">📒 Upload Notes (PDF only):</label>
        <input type="file" name="notesFile" id="notesFile" accept=".pdf" required>
      </div>

      <div class="upload-block">
        <label for="qpFile">📄 Upload Question Papers (PDF only):</label>
        <input type="file" name="qpFile" id="qpFile" accept=".pdf" required>
      </div>

      <input type="hidden" name="subject" value="MATHS">
      <input type="submit" value="📤 Upload Files">
    </form>
  </div>
</body>
</html>
