<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resources</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .resource-box {
      padding: 20px;
      margin: 10px;
      border: 2px solid #999;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      background: #f0f8ff;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .resource-box:hover {
      background: #d1e7ff;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="main-container">
    <h2>Resources</h2>
    <div class="dropdowns" id="resources"></div>
  </div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const subject = params.get('subject');

  const googleDriveLinks = {
    "MATHS": {
      notes: "pdfs/bca/sem1/m1.jpg",
      qp: "pdfs/bca/sem1/maths_qp.pdf"
    },
    "CFDP": {
      notes: "pdfs/bca/sem1/cfdp_notes.pdf",
      qp: "pdfs/bca/sem1/cfdp_qp.pdf"
    },
    "ENGLISH": {
      notes: "pdfs/bca/sem1/english_notes.pdf",
      qp: "pdfs/bca/sem1/english_qp.pdf"
    },
    "STATI": {
      notes: "pdfs/bca/sem1/stati_notes.pdf",
      qp: "pdfs/bca/sem1/stati_qp.pdf"
    }
    // Add more subjects similarly
  };

  const links = googleDriveLinks[subject];
  const container = document.getElementById("resources");

  if (links) {
    container.innerHTML = `
      <div class="resource-box" onclick="window.open('${links.notes}', '_blank')">📒 NOTES</div>
      <div class="resource-box" onclick="window.open('${links.qp}', '_blank')">📄 QUESTION PAPER</div>
    `;
  } else {
    container.innerHTML = "<p>Drive or local links not found for this subject.</p>";
  }
</script>

</body>
</html>
