<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - NoteVerse</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgb(0 0 0 / 0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }
    input[type="file"] {
      margin-top: 10px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background: #6a11cb;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #2575fc;
    }
    .file-list {
      margin-top: 30px;
    }
    .file-list-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #eee;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .file-list-item button {
      background: #e63946;
      padding: 5px 10px;
      font-size: 0.85rem;
    }
    .file-list-item button:hover {
      background: #b22222;
    }
  </style>
</head>
<body>


  <!-- Header with Logo and Username -->
  <header style="
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    border-radius: 15px;
    margin-bottom: 30px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
  ">
    <img src="https://cdn-icons-png.flaticon.com/512/2972/2972712.png" alt="Logo" style="height: 50px;">
    <div style="font-weight: bold; font-size: 1.2rem;">👤 Admin: <span style="color: #333;">John Doe</span></div>
  </header>

  <!-- Container with Upload and Delete Boxes -->
  <div class="container" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">

    <!-- Upload Box -->
    <div style="
      flex: 1 1 250px;
      background: white;
      border-radius: 20px;
      padding: 100px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    ">
      <h3>📤 Upload Section</h3>
      <form id="uploadForm">
        <input type="file" id="fileUpload" name="fileUpload" accept=".pdf,.doc,.docx,.txt" style="margin-bottom: 10px;" />
        <button type="submit">Upload</button>
      </form>
    </div>

    <!-- Delete Box -->
    <div style="
      flex: 1 1 250px;
      background: white;
      border-radius: 20px;
      padding: 80px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    ">
      <h3>🗑️ Delete Section</h3>
      <div class="file-list-item" style="margin: 10px 0;">
        <span>math_notes.pdf</span>
        <button onclick="deleteFile('math_notes.pdf')">Delete</button>
      </div>
      <div class="file-list-item">
        <span>physics_qpaper.docx</span>
        <button onclick="deleteFile('physics_qpaper.docx')">Delete</button>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script>
    const uploadForm = document.getElementById('uploadForm');

    uploadForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const fileInput = document.getElementById('fileUpload');
      if (!fileInput.files.length) {
        alert('Please select a file to upload.');
        return;
      }
      alert(`File "${fileInput.files[0].name}" uploaded! (Functionality not implemented)`);
      fileInput.value = '';
    });

    function deleteFile(filename) {
      if (confirm(`Are you sure you want to delete "${filename}"?`)) {
        alert(`File "${filename}" deleted! (Functionality not implemented)`);
      }
    }
  </script>


</body>
</html>
